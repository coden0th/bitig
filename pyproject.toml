[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitig"
version = "0.1.0"
description = "Deterministic Turkish morphological analysis engine — derivation, not detection."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Turkish",
]

# Üretim bağımlılığı yok — bitig/ paketi saf standart kütüphane
# (bkz. README.md / ARCHITECTURE.md §6). Aşağıdakiler yalnızca ölçüm/geliştirme
# içindir (requirements-dev.txt ile aynı liste, tek kaynağı burası).
[project.optional-dependencies]
dev = [
    "pytest>=8",
    # harness/anlasmazlik.py'de dış görüş olarak kullanılır, hakem değildir
    # (bkz. ARCHITECTURE.md §6). Üretim hattında hiç yer almaz.
    "zeyrek>=0.1.3",
]

[tool.setuptools]
# Çekirdek motor bir pakettir (bitig/); türetilmiş motorlar (yazım, noktalama,
# vb.) tek dosyalık kök-seviye modüllerdir — hepsi çalışma zamanında `veri/`yi
# kendi konumlarına göre (kardeş dizin olarak) arar (bkz. ARCHITECTURE.md).
# Bu yüzden bu paket şu an yalnızca DÜZENLENEBİLİR kurulum (`pip install -e .`)
# için tasarlanmıştır — tam depo kopyası olmadan (yalıtılmış bir wheel'den)
# `veri/`ye erişemez. İzole, veri-gömülü bir dağıtım paketi henüz ayrı bir iş.
py-modules = [
    "yazim",
    "baglam",
    "anlatim",
    "noktalama",
    "atasozu",
    "hece",
    "isim_soylu",
]

[tool.setuptools.packages.find]
# `harness` yalnızca `baglam.py`'nin bağlı olduğu `harness.model` (saf
# stdlib, ağa dokunan tek nokta) için dahil edildi — geliştirme/ölçüm
# araçlarının tamamını dağıtım paketinin parçası saymaz, sadece bu tek
# ince istemciyi gerçekten import edilebilir kılar.
include = ["bitig", "bitig.*", "harness"]

[tool.pytest.ini_options]
testpaths = ["testler"]
